[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "support-ops"
version = "0.1.0"
description = "A staged customer support agent project with controlled tool execution."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain-core>=1.0,<2",
  "langchain-groq>=1.0,<2",
  "langgraph>=1.0,<2",
  "langsmith>=0.4,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "groq>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29,<8",
  "matplotlib>=3.8,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/support_ops"]
